<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>King's Valley — MSX RC727</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #101014;
        color: #888894;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      #display {
        display: block;
        background: #000;
        border: 1px solid #262630;
        line-height: 0;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        background: #000;
      }
      #status { min-height: 1.5em; text-align: center; }
    </style>
  </head>
  <body>
    <div id="display"><canvas id="screen" width="256" height="192"></canvas></div>
    <p id="status">loading…</p>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
